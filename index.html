<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Blaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  #gameCanvas {
    display: block;
    border: 1px solid #0ff3;
    box-shadow: 0 0 30px #0ff4, 0 0 60px #0ff2;
    cursor: crosshair;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.85);
    pointer-events: all;
  }
  #overlay h1 {
    font-size: clamp(28px, 6vw, 52px);
    color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    letter-spacing: 6px;
    margin-bottom: 10px;
  }
  #overlay .subtitle {
    color: #f0f;
    font-size: clamp(11px, 2vw, 14px);
    letter-spacing: 3px;
    margin-bottom: 40px;
    text-shadow: 0 0 10px #f0f;
  }
  #overlay .score-display {
    color: #ff0;
    font-size: clamp(16px, 3vw, 22px);
    margin-bottom: 30px;
    text-shadow: 0 0 10px #ff0;
    display: none;
  }
  #overlay .btn {
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    font-family: 'Courier New', monospace;
    font-size: clamp(14px, 2.5vw, 18px);
    letter-spacing: 4px;
    padding: 14px 40px;
    cursor: pointer;
    pointer-events: all;
    transition: all 0.2s;
    text-transform: uppercase;
    margin-bottom: 16px;
    min-width: 180px;
  }
  #overlay .btn:hover, #overlay .btn:active {
    background: #0ff2;
    box-shadow: 0 0 20px #0ff;
    transform: scale(1.05);
  }
  #overlay .controls {
    color: #666;
    font-size: clamp(10px, 1.8vw, 13px);
    margin-top: 20px;
    text-align: center;
    line-height: 1.8;
    letter-spacing: 1px;
  }
  #overlay .controls span { color: #0ff8; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="overlay">
    <h1>NEON BLASTER</h1>
    <div class="subtitle">∞ SURVIVE THE WAVE ∞</div>
    <div class="score-display" id="finalScore"></div>
    <button class="btn" id="startBtn">▶ START GAME</button>
    <div class="controls">
      <span>MOUSE / DRAG</span> — Move Ship<br>
      <span>AUTO-FIRE</span> — Shoot Enemies<br>
      <span>COLLECT</span> — Power-Ups &amp; Shields
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const finalScore = document.getElementById('finalScore');

// ─── Responsive sizing ─────────────────────────────────────────────────────
function resize() {
  const size = Math.min(window.innerWidth, window.innerHeight, 520);
  canvas.width  = size;
  canvas.height = Math.min(window.innerHeight, size * 1.5, 720);
}
resize();
window.addEventListener('resize', resize);

// ─── Audio (Web Audio API) ──────────────────────────────────────────────────
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, vol, dur, detune = 0) {
  try {
    const ac = getAudio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.value = freq; o.detune.value = detune;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function sfxShoot()   { playTone(880, 'square', 0.06, 0.08, 200); }
function sfxExplode() { playTone(120, 'sawtooth', 0.18, 0.25); playTone(80, 'sawtooth', 0.12, 0.35, -50); }
function sfxPowerup() { playTone(660, 'sine', 0.12, 0.1); setTimeout(()=>playTone(880,'sine',0.12,0.1),100); setTimeout(()=>playTone(1100,'sine',0.12,0.1),200); }
function sfxHit()     { playTone(200, 'sawtooth', 0.15, 0.15); }
function sfxDie()     { playTone(150,'sawtooth',0.2,0.5); setTimeout(()=>playTone(80,'sawtooth',0.2,0.6),200); }

// ─── Stars ──────────────────────────────────────────────────────────────────
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + 0.3, s: Math.random() * 0.6 + 0.2 });
}
function drawStars() {
  stars.forEach(s => {
    s.y += s.s * 0.0003;
    if (s.y > 1) s.y = 0;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + s.s * 0.5})`;
    ctx.fill();
  });
}

// ─── Game state ─────────────────────────────────────────────────────────────
let state = 'menu'; // menu | playing | dead
let score, lives, wave, fireTimer, waveTimer, shield, shieldTimer, rapidTimer;
let player, bullets, enemies, particles, powerups, enemyBullets;

function initGame() {
  score = 0; lives = 3; wave = 1; fireTimer = 0; waveTimer = 0;
  shield = false; shieldTimer = 0; rapidTimer = 0;
  player = {
    x: canvas.width / 2, y: canvas.height * 0.82,
    w: 28, h: 32, vx: 0, vy: 0,
    invincible: 0
  };
  bullets = []; enemies = []; particles = []; powerups = []; enemyBullets = [];
  spawnWave();
  state = 'playing';
}

// ─── Wave spawning ──────────────────────────────────────────────────────────
const ENEMY_TYPES = [
  { color: '#f00', hp: 1, pts: 10, speed: 1.2, size: 14, shoot: false },
  { color: '#f80', hp: 2, pts: 25, speed: 0.9, size: 18, shoot: false },
  { color: '#f0f', hp: 3, pts: 50, speed: 0.7, size: 22, shoot: true  },
  { color: '#ff0', hp: 5, pts: 100, speed: 0.5, size: 30, shoot: true  }, // boss
];
function spawnWave() {
  const count = 5 + wave * 2;
  const typeIndex = Math.min(Math.floor(wave / 3), ENEMY_TYPES.length - 2);
  for (let i = 0; i < count; i++) {
    const t = ENEMY_TYPES[Math.random() < 0.15 && wave > 2 ? typeIndex + 1 : typeIndex];
    enemies.push({
      x: 30 + Math.random() * (canvas.width - 60),
      y: -20 - i * 55,
      ...t, hp: t.hp, maxHp: t.hp,
      vx: (Math.random() - 0.5) * 1.5,
      vy: t.speed * (0.8 + Math.random() * 0.4),
      shootTimer: Math.random() * 120
    });
  }
}

// ─── Input ──────────────────────────────────────────────────────────────────
let pointer = { x: canvas.width / 2, y: canvas.height * 0.82, down: false };

function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
canvas.addEventListener('mousemove', e => { const p = pointerPos(e); pointer.x = p.x; pointer.y = p.y; });
canvas.addEventListener('mousedown', e => { pointer.down = true; const p = pointerPos(e); pointer.x = p.x; pointer.y = p.y; });
canvas.addEventListener('mouseup',   () => pointer.down = false);
canvas.addEventListener('touchstart', e => { e.preventDefault(); pointer.down = true; const p = pointerPos(e); pointer.x = p.x; pointer.y = p.y; }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); const p = pointerPos(e); pointer.x = p.x; pointer.y = p.y; }, { passive: false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); pointer.down = false; }, { passive: false });

// ─── Particles ──────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      r: 2 + Math.random() * 3, life: 1, color
    });
  }
}

// ─── Drawing helpers ────────────────────────────────────────────────────────
function glowRect(x, y, w, h, color, blur = 10) {
  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x - w/2, y - h/2, w, h);
  ctx.restore();
}
function drawShip(x, y, w, h, color, alpha = 1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = color; ctx.shadowBlur = 18;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - h/2);
  ctx.lineTo(x - w/2, y + h/2);
  ctx.lineTo(x - w/4, y + h/4);
  ctx.lineTo(x, y + h/3);
  ctx.lineTo(x + w/4, y + h/4);
  ctx.lineTo(x + w/2, y + h/2);
  ctx.closePath();
  ctx.fill();
  // Engine glow
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ff0';
  ctx.beginPath();
  ctx.ellipse(x, y + h/2 + 3, 5, 8 + Math.random() * 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawEnemy(e) {
  ctx.save();
  ctx.shadowColor = e.color; ctx.shadowBlur = 14;
  ctx.fillStyle = e.color;
  // Different shapes per type
  if (e.size > 25) { // boss diamond
    ctx.beginPath();
    ctx.moveTo(e.x, e.y - e.size); ctx.lineTo(e.x + e.size * 0.7, e.y);
    ctx.lineTo(e.x, e.y + e.size); ctx.lineTo(e.x - e.size * 0.7, e.y);
    ctx.closePath(); ctx.fill();
  } else if (e.shoot) { // shooter hexagon
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i/6) * Math.PI * 2 - Math.PI/6;
      if (i === 0) ctx.moveTo(e.x + Math.cos(a)*e.size, e.y + Math.sin(a)*e.size);
      else ctx.lineTo(e.x + Math.cos(a)*e.size, e.y + Math.sin(a)*e.size);
    }
    ctx.closePath(); ctx.fill();
  } else { // basic triangle
    ctx.beginPath();
    ctx.moveTo(e.x, e.y + e.size);
    ctx.lineTo(e.x - e.size * 0.9, e.y - e.size * 0.7);
    ctx.lineTo(e.x + e.size * 0.9, e.y - e.size * 0.7);
    ctx.closePath(); ctx.fill();
  }
  // HP bar
  if (e.maxHp > 1) {
    const bw = e.size * 2.2;
    ctx.fillStyle = '#333';
    ctx.fillRect(e.x - bw/2, e.y - e.size - 8, bw, 4);
    ctx.fillStyle = e.color;
    ctx.shadowBlur = 5;
    ctx.fillRect(e.x - bw/2, e.y - e.size - 8, bw * (e.hp / e.maxHp), 4);
  }
  ctx.restore();
}
function drawHUD() {
  // Score
  ctx.save();
  ctx.fillStyle = '#0ff';
  ctx.shadowColor = '#0ff'; ctx.shadowBlur = 8;
  ctx.font = `bold ${Math.max(13, canvas.width * 0.035)}px Courier New`;
  ctx.fillText(`SCORE: ${score}`, 12, 26);
  // Wave
  ctx.fillStyle = '#f0f';
  ctx.shadowColor = '#f0f';
  ctx.textAlign = 'center';
  ctx.fillText(`WAVE ${wave}`, canvas.width/2, 26);
  // Lives
  ctx.textAlign = 'right';
  ctx.fillStyle = '#f44';
  ctx.shadowColor = '#f44';
  for (let i = 0; i < lives; i++) {
    ctx.fillText('♥', canvas.width - 10 - i * 22, 26);
  }
  // Power-up timers
  let py = canvas.height - 12;
  if (shield) {
    ctx.textAlign = 'left'; ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff';
    ctx.fillText(`🛡 SHIELD ${Math.ceil(shieldTimer/60)}s`, 10, py); py -= 22;
  }
  if (rapidTimer > 0) {
    ctx.textAlign = 'left'; ctx.fillStyle = '#ff0'; ctx.shadowColor = '#ff0';
    ctx.fillText(`⚡ RAPID ${Math.ceil(rapidTimer/60)}s`, 10, py);
  }
  ctx.restore();
}

// ─── Collision (AABB) ───────────────────────────────────────────────────────
function hit(ax, ay, ar, bx, by, br) {
  return Math.hypot(ax - bx, ay - by) < ar + br;
}

// ─── Main update ────────────────────────────────────────────────────────────
let lastTime = 0;
function update(ts) {
  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;

  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawStars();

  if (state === 'playing') {
    // ── Player movement ──
    const tx = pointer.x, ty = pointer.y;
    player.vx += (tx - player.x) * 0.12 * dt;
    player.vy += (ty - player.y) * 0.12 * dt;
    player.vx *= 0.78; player.vy *= 0.78;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
    player.x = Math.max(player.w/2, Math.min(canvas.width - player.w/2, player.x));
    player.y = Math.max(player.h/2, Math.min(canvas.height - player.h/2, player.y));
    if (player.invincible > 0) player.invincible -= dt;

    // ── Auto-fire ──
    const fireRate = rapidTimer > 0 ? 6 : 14;
    fireTimer -= dt;
    if (fireTimer <= 0) {
      fireTimer = fireRate;
      bullets.push({ x: player.x, y: player.y - player.h/2, vy: -11, r: 4 });
      if (rapidTimer > 0) {
        bullets.push({ x: player.x - 10, y: player.y, vy: -10, r: 3 });
        bullets.push({ x: player.x + 10, y: player.y, vy: -10, r: 3 });
      }
      sfxShoot();
    }
    if (rapidTimer > 0) rapidTimer -= dt;
    if (shieldTimer > 0) { shieldTimer -= dt; if (shieldTimer <= 0) shield = false; }

    // ── Bullets ──
    bullets = bullets.filter(b => {
      b.y += b.vy * dt;
      if (b.y < -10) return false;
      // Bullet glow
      ctx.save();
      ctx.shadowColor = '#0ff'; ctx.shadowBlur = 10;
      ctx.fillStyle = '#0ff';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return true;
    });

    // ── Enemy bullets ──
    enemyBullets = enemyBullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > canvas.height + 10) return false;
      ctx.save();
      ctx.shadowColor = '#f80'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#f80';
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // Hit player
      if (player.invincible <= 0 && hit(b.x, b.y, 5, player.x, player.y, 14)) {
        if (shield) { shield = false; shieldTimer = 0; spawnParticles(player.x, player.y, '#0ff', 15); sfxHit(); }
        else { loseLife(); }
        return false;
      }
      return true;
    });

    // ── Enemies ──
    enemies = enemies.filter(e => {
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.x < e.size || e.x > canvas.width - e.size) e.vx *= -1;
      if (e.y > canvas.height + 60) { loseLife(); return false; }

      // Enemy shooting
      if (e.shoot) {
        e.shootTimer -= dt;
        if (e.shootTimer <= 0) {
          e.shootTimer = 90 - wave * 3;
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          const spd = 3 + wave * 0.2;
          enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd });
        }
      }

      // Bullet hits enemy
      let alive = true;
      bullets = bullets.filter(b => {
        if (alive && hit(b.x, b.y, b.r, e.x, e.y, e.size * 0.85)) {
          e.hp--;
          spawnParticles(b.x, b.y, e.color, 4);
          if (e.hp <= 0) {
            score += e.pts * wave;
            spawnParticles(e.x, e.y, e.color, 18);
            sfxExplode();
            // Chance to drop powerup
            if (Math.random() < 0.22) spawnPowerup(e.x, e.y);
            alive = false;
          }
          return false;
        }
        return true;
      });

      // Enemy hits player
      if (alive && player.invincible <= 0 && hit(e.x, e.y, e.size * 0.7, player.x, player.y, 14)) {
        if (shield) { shield = false; shieldTimer = 0; spawnParticles(player.x, player.y, '#0ff', 15); sfxHit(); alive = false; }
        else { loseLife(); alive = false; }
      }

      if (alive) drawEnemy(e);
      return alive;
    });

    // ── Power-ups ──
    powerups = powerups.filter(p => {
      p.y += 1.5 * dt; p.life -= dt * 0.005;
      if (p.y > canvas.height + 20 || p.life <= 0) return false;
      // Draw
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life * 3);
      ctx.shadowColor = p.color; ctx.shadowBlur = 16;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.textAlign = 'center';
      ctx.font = 'bold 11px Courier New'; ctx.fillText(p.label, p.x, p.y + 4);
      ctx.restore();
      // Collect
      if (hit(p.x, p.y, 12, player.x, player.y, 18)) {
        sfxPowerup();
        if (p.type === 'shield') { shield = true; shieldTimer = 300; }
        else if (p.type === 'rapid') { rapidTimer = 240; }
        else if (p.type === 'life') { lives = Math.min(5, lives + 1); }
        return false;
      }
      return true;
    });

    // ── Particles ──
    particles = particles.filter(p => {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      p.life -= 0.025 * dt;
      if (p.life <= 0) return false;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      return true;
    });

    // ── Draw player ──
    const alpha = player.invincible > 0 ? 0.4 + Math.sin(ts * 0.05) * 0.4 : 1;
    drawShip(player.x, player.y, player.w, player.h, '#0ff', alpha);
    if (shield) {
      ctx.save();
      ctx.strokeStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20;
      ctx.globalAlpha = 0.4 + Math.sin(ts * 0.008) * 0.2;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // ── Next wave ──
    if (enemies.length === 0) {
      waveTimer += dt;
      ctx.save();
      ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff'; ctx.shadowBlur = 20;
      ctx.font = `bold ${canvas.width * 0.05}px Courier New`;
      ctx.textAlign = 'center';
      ctx.globalAlpha = 0.5 + Math.sin(ts * 0.01) * 0.4;
      ctx.fillText(`WAVE ${wave} CLEAR!`, canvas.width/2, canvas.height/2);
      ctx.restore();
      if (waveTimer > 120) { wave++; waveTimer = 0; spawnWave(); }
    }

    drawHUD();
  }

  requestAnimationFrame(update);
}

function spawnPowerup(x, y) {
  const types = [
    { type: 'shield', color: '#0ff', label: '🛡' },
    { type: 'rapid',  color: '#ff0', label: '⚡' },
    { type: 'life',   color: '#f44', label: '♥' },
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  powerups.push({ x, y, ...t, life: 1 });
}

function loseLife() {
  sfxHit();
  lives--;
  player.invincible = 120;
  spawnParticles(player.x, player.y, '#f00', 20);
  if (lives <= 0) {
    sfxDie();
    state = 'dead';
    finalScore.style.display = 'block';
    finalScore.textContent = `SCORE: ${score}  |  WAVE: ${wave}`;
    startBtn.textContent = '▶ PLAY AGAIN';
    overlay.style.display = 'flex';
  }
}

// ─── Start / Restart ────────────────────────────────────────────────────────
startBtn.addEventListener('click', () => {
  overlay.style.display = 'none';
  initGame();
});

requestAnimationFrame(update);
</script>
</body>
</html>
