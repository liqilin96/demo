<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Echo Rider</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; align-items:center; justify-content:center; height:100vh; overflow:hidden; font-family:'Courier New',monospace; touch-action:none; user-select:none; }
#c { display:block; }
#ui { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
.screen { display:flex; flex-direction:column; align-items:center; background:rgba(4,6,20,0.92); padding:clamp(24px,5vw,44px) clamp(28px,6vw,54px); border:1px solid #0ff4; box-shadow:0 0 40px #0ff3, inset 0 0 40px #0ff1; pointer-events:all; }
h1 { font-size:clamp(30px,7vw,56px); color:#0ff; text-shadow:0 0 20px #0ff,0 0 50px #0ff; letter-spacing:8px; margin-bottom:6px; }
.sub { color:#f0f8; font-size:clamp(10px,2vw,13px); letter-spacing:4px; margin-bottom:28px; text-shadow:0 0 10px #f0f; }
.score-label { color:#555; font-size:10px; letter-spacing:4px; margin-bottom:4px; }
.score-big { font-size:clamp(52px,12vw,88px); color:#ff0; text-shadow:0 0 30px #ff0,0 0 60px #ff06; line-height:1; margin-bottom:4px; }
.score-best { color:#0f8; font-size:clamp(13px,2.5vw,17px); letter-spacing:3px; margin-bottom:26px; text-shadow:0 0 10px #0f8; }
.btn { background:transparent; border:2px solid #0ff; color:#0ff; font-family:'Courier New',monospace; font-size:clamp(12px,2.2vw,15px); letter-spacing:4px; padding:13px 32px; cursor:pointer; transition:all 0.2s; text-transform:uppercase; margin:5px; min-width:190px; }
.btn:hover,.btn:active { background:#0ff2; box-shadow:0 0 20px #0ff; transform:scale(1.04); }
.btn-dim { border-color:#333; color:#444; }
.btn-dim:hover,.btn-dim:active { border-color:#666; color:#666; background:#0ff1; box-shadow:none; }
.hint { color:#333; font-size:clamp(9px,1.5vw,11px); margin-top:18px; text-align:center; line-height:2.1; letter-spacing:1px; }
.hint b { color:#0ff6; font-weight:normal; }
#mstat { min-height:18px; font-size:11px; letter-spacing:2px; margin-top:10px; color:#ff0; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="sMenu" class="screen">
    <h1>ECHO RIDER</h1>
    <div class="sub">∞ YOUR VOICE IS THE CONTROLLER ∞</div>
    <button class="btn" id="micBtn">🎤 USE MICROPHONE</button>
    <button class="btn btn-dim" id="tapBtn">👆 USE TAP / CLICK</button>
    <div id="mstat"></div>
    <div class="hint">
      <b>BLOW / SPEAK</b> — Fly Up&nbsp;&nbsp;&nbsp;<b>QUIET</b> — Fall Down<br>
      Navigate the neon gaps — survive as long as you can
    </div>
  </div>
  <div id="sDead" class="screen" style="display:none">
    <div class="score-label">SCORE</div>
    <div class="score-big" id="dScore">0</div>
    <div class="score-best" id="dBest">BEST: 0</div>
    <button class="btn" id="retryBtn">▶ PLAY AGAIN</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const sMenu  = document.getElementById('sMenu');
const sDead  = document.getElementById('sDead');
const mstat  = document.getElementById('mstat');
const dScore = document.getElementById('dScore');
const dBest  = document.getElementById('dBest');

// ── Resize ────────────────────────────────────────────────────────────────────
function resize() {
  canvas.width  = Math.min(window.innerWidth,  500);
  canvas.height = Math.min(window.innerHeight, 700);
}
resize(); window.addEventListener('resize', resize);

// ── Audio context (shared for mic + sfx) ─────────────────────────────────────
let ac = null, analyser = null, waveArr = null;
let useMic = false, tapHeld = false, smoothVol = 0;

async function initAudio(wantMic) {
  ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') await ac.resume();
  if (!wantMic) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.65;
    src.connect(analyser);
    waveArr = new Uint8Array(analyser.fftSize);
    useMic = true;
    return true;
  } catch(e) { return false; }
}

function getVol() {
  if (analyser) {
    analyser.getByteTimeDomainData(waveArr);
    let s = 0;
    for (let i = 0; i < waveArr.length; i++) s += Math.abs(waveArr[i] - 128);
    const raw = s / (waveArr.length * 128);
    smoothVol = smoothVol * 0.6 + raw * 0.4;
  } else {
    smoothVol = tapHeld ? 0.55 : 0;
  }
  return smoothVol;
}

// ── Input (tap fallback) ──────────────────────────────────────────────────────
canvas.addEventListener('mousedown', ()=>tapHeld=true);
canvas.addEventListener('mouseup',   ()=>tapHeld=false);
canvas.addEventListener('mouseleave',()=>tapHeld=false);
canvas.addEventListener('touchstart', e=>{e.preventDefault();tapHeld=true;}, {passive:false});
canvas.addEventListener('touchend',   e=>{e.preventDefault();tapHeld=false;},{passive:false});
document.addEventListener('keydown', e=>{ if(e.code==='Space'){e.preventDefault();tapHeld=true;} });
document.addEventListener('keyup',   e=>{ if(e.code==='Space') tapHeld=false; });

// ── SFX ───────────────────────────────────────────────────────────────────────
function sfx(freq, type, vol, dur) {
  if (!ac) return;
  try {
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+dur);
    o.start(); o.stop(ac.currentTime+dur);
  } catch(e){}
}
function sfxScore(){ sfx(880,'sine',0.08,0.06); setTimeout(()=>sfx(1320,'sine',0.08,0.06),70); }
function sfxDie()  { sfx(220,'sawtooth',0.18,0.35); setTimeout(()=>sfx(110,'sawtooth',0.15,0.5),200); }

// ── Stars ─────────────────────────────────────────────────────────────────────
const STARS = Array.from({length:120},()=>({
  x:Math.random()*500, y:Math.random()*700,
  r:Math.random()*1.4+0.3, sp:Math.random()*0.8+0.2
}));
function drawStars(dt) {
  STARS.forEach(s=>{
    s.x -= s.sp * 0.6 * dt;
    if (s.x < 0) { s.x = canvas.width; s.y = Math.random()*canvas.height; }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(200,220,255,' + (0.25 + s.sp*0.35) + ')';
    ctx.fill();
  });
}

// ── Screen Shake ──────────────────────────────────────────────────────────────
let sx=0, sy=0, sp=0;
function shake(p){ sp=Math.max(sp,p); }
function updShake(){
  if(sp>0.3){sx=(Math.random()-0.5)*sp;sy=(Math.random()-0.5)*sp;sp*=0.78;}
  else{sx=sy=sp=0;}
}

// ── Bird ──────────────────────────────────────────────────────────────────────
const GRAVITY    = 0.34;
const VOL_THRESH = 0.038;
const LIFT_K     = 11;
const MAX_UP     = 6.5;
const MAX_DOWN   = 7.5;
const GROUND_Y   = ()=> canvas.height - 58; // waveform zone below

let bird, trail;
function resetBird() {
  bird = { x: canvas.width*0.24, y: canvas.height/2 - 20, vy:0, ang:0, glow:0 };
  trail = [];
}

function updateBird(dt, vol) {
  bird.vy += GRAVITY * dt;
  const eff = Math.max(0, vol - VOL_THRESH);
  if (eff > 0) bird.vy -= eff * LIFT_K * dt;
  bird.vy = Math.max(-MAX_UP, Math.min(MAX_DOWN, bird.vy));
  bird.y  += bird.vy * dt;
  bird.ang = Math.max(-0.45, Math.min(0.55, bird.vy * 0.065));
  bird.glow = Math.min(1, eff * 9);

  // Trail
  trail.unshift({ x:bird.x, y:bird.y, g:bird.glow });
  if (trail.length > 28) trail.pop();

  if (bird.y < 12) { bird.y=12; bird.vy=Math.abs(bird.vy)*0.3; }
  if (bird.y + 14 > GROUND_Y()) return false; // hit floor
  return true;
}

function drawBird() {
  // Trail
  trail.forEach((t,i)=>{
    const a = (1 - i/trail.length) * 0.28;
    const col = t.g > 0.4 ? '#ff0' : t.g > 0.15 ? '#0f8' : '#0ff';
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = col; ctx.shadowBlur = 8;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(t.x, t.y, (14-i*0.4)*0.5, 0, Math.PI*2);
    ctx.fill(); ctx.restore();
  });
  // Body
  const col = bird.glow>0.55?'#ff0': bird.glow>0.2?'#0f8':'#0ff';
  const R = 14, gBlur = 12 + bird.glow*28;
  ctx.save();
  ctx.translate(bird.x, bird.y); ctx.rotate(bird.ang);
  ctx.shadowColor=col; ctx.shadowBlur=gBlur; ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(0,0,R+bird.glow*4,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=4; ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(0,0,R*0.42,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Pipes ─────────────────────────────────────────────────────────────────────
const PW = 52;
let pipes, ptimer, pspd, pgap, score;

function resetPipes(){
  pipes=[]; ptimer=0;
  pspd=2.5; pgap=182; score=0;
}

function spawnPipe(){
  const margin = canvas.height*0.14;
  const topMax  = GROUND_Y() - pgap - margin;
  const topH    = margin + Math.random()*(topMax - margin);
  pipes.push({ x: canvas.width+30, topH, passed:false });
}

function updatePipes(dt){
  ptimer += dt;
  const interval = Math.max(75, 128 - score*1.2);
  if (ptimer >= interval){ ptimer=0; spawnPipe(); }
  pspd = Math.min(5.5, 2.5 + score*0.045);
  pgap = Math.max(108, 182 - score*1.5);
  pipes.forEach(p=>{
    p.x -= pspd*dt;
    if (!p.passed && p.x + PW/2 < bird.x){
      p.passed=true; score++;
      sfxScore(); sparkBurst(bird.x, bird.y);
    }
  });
  pipes = pipes.filter(p=>p.x>-80);
}

function pipeHit(){
  const R=11;
  for(const p of pipes){
    if(bird.x+R > p.x-PW/2 && bird.x-R < p.x+PW/2){
      if(bird.y-R < p.topH || bird.y+R > p.topH+pgap) return true;
    }
  }
  return false;
}

function drawPipes(){
  pipes.forEach(p=>{
    const botY = p.topH + pgap;
    const botH = GROUND_Y() - botY;
    ['#0cf','#0af'].forEach((col,ci)=>{
      ctx.save();
      ctx.shadowColor=col; ctx.shadowBlur=ci?6:16; ctx.fillStyle=col;
      // Top
      ctx.fillRect(p.x-PW/2, 0, PW, p.topH);
      ctx.fillRect(p.x-PW/2-6, p.topH-22, PW+12, 22);
      // Bot
      ctx.fillRect(p.x-PW/2, botY, PW, botH);
      ctx.fillRect(p.x-PW/2-6, botY, PW+12, 22);
      ctx.restore();
    });
    // Inner highlight
    ctx.save(); ctx.strokeStyle='#fff3'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(p.x+10,0); ctx.lineTo(p.x+10,p.topH);
    ctx.moveTo(p.x+10,botY); ctx.lineTo(p.x+10,GROUND_Y());
    ctx.stroke(); ctx.restore();
  });
}

// ── Sparks ────────────────────────────────────────────────────────────────────
let sparks=[];
function sparkBurst(x,y){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, spd=2+Math.random()*4;
    sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,col:'#ff0'});
  }
}
function drawSparks(dt){
  sparks=sparks.filter(s=>{
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=0.12*dt; s.life-=0.032*dt;
    if(s.life<=0) return false;
    ctx.save(); ctx.globalAlpha=s.life;
    ctx.fillStyle=s.col; ctx.shadowColor=s.col; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(s.x,s.y,3.5*s.life,0,Math.PI*2);
    ctx.fill(); ctx.restore(); return true;
  });
}

// ── Death particles ───────────────────────────────────────────────────────────
let deathParts=[];
function deathBurst(x,y){
  for(let i=0;i<35;i++){
    const a=Math.random()*Math.PI*2, spd=1.5+Math.random()*5;
    const cols=['#0ff','#f0f','#ff0','#fff'];
    deathParts.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,col:cols[i%4]});
  }
}
function drawDeathParts(dt){
  deathParts=deathParts.filter(p=>{
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.95; p.vy*=0.95; p.life-=0.018*dt;
    if(p.life<=0) return false;
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,4*p.life,0,Math.PI*2);
    ctx.fill(); ctx.restore(); return true;
  });
}

// ── Waveform zone ─────────────────────────────────────────────────────────────
let fakePhase=0;
function drawWaveZone(dt, vol){
  const gy = GROUND_Y();
  const zh = canvas.height - gy;
  fakePhase += 0.04*dt;

  // Ground line glow
  ctx.save();
  ctx.strokeStyle='#0ff5'; ctx.shadowColor='#0ff'; ctx.shadowBlur=8; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(canvas.width,gy); ctx.stroke();
  ctx.restore();

  // Waveform
  ctx.save();
  const bright = 0.35 + vol*0.55;
  ctx.strokeStyle='rgba(0,255,255,'+bright+')';
  ctx.shadowColor='#0ff'; ctx.shadowBlur=vol>0.08?10:4; ctx.lineWidth=1.8;
  ctx.beginPath();

  if (analyser && waveArr) {
    analyser.getByteTimeDomainData(waveArr);
    const sw = canvas.width / waveArr.length;
    for(let i=0;i<waveArr.length;i++){
      const v = waveArr[i]/128.0 - 1;
      const y = gy + zh*0.5 + v*(zh*0.44);
      if(i===0) ctx.moveTo(0,y); else ctx.lineTo(i*sw,y);
    }
  } else {
    // Simulated sine wave (tap mode)
    const amp = tapHeld ? zh*0.38 : zh*0.08;
    for(let x=0;x<=canvas.width;x+=3){
      const y = gy + zh*0.5 + Math.sin(x*0.035 + fakePhase*3)*amp
                             + Math.sin(x*0.08  + fakePhase*5)*amp*0.3;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
  }
  ctx.stroke();

  // Fill under wave
  ctx.globalAlpha=0.12;
  ctx.fillStyle='#0ff';
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ── Volume bar (left side) ────────────────────────────────────────────────────
function drawVolBar(vol){
  const mh=canvas.height*0.45, mx=10, my=(canvas.height-mh)/2, mw=7;
  ctx.save();
  ctx.fillStyle='#0ff1'; ctx.fillRect(mx,my,mw,mh);
  const fh = mh * Math.min(1, vol*7);
  const fy = my+mh-fh;
  const g = ctx.createLinearGradient(0,fy,0,my+mh);
  g.addColorStop(0,'#f44'); g.addColorStop(0.45,'#ff0'); g.addColorStop(1,'#0f8');
  ctx.fillStyle=g; ctx.shadowColor='#0ff'; ctx.shadowBlur=10;
  ctx.fillRect(mx,fy,mw,fh);
  ctx.strokeStyle='#0ff4'; ctx.lineWidth=1; ctx.strokeRect(mx,my,mw,mh);
  // Threshold line
  const ty = my+mh - mh*VOL_THRESH*7;
  ctx.strokeStyle='#ff05'; ctx.setLineDash([2,3]);
  ctx.beginPath(); ctx.moveTo(mx-1,ty); ctx.lineTo(mx+mw+1,ty); ctx.stroke();
  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(){
  ctx.save();
  ctx.textAlign='center';
  ctx.font='bold '+Math.max(28,canvas.width*0.065)+'px Courier New';
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.shadowColor='#fff'; ctx.shadowBlur=14;
  ctx.fillText(score, canvas.width/2, 50);
  ctx.font='bold 10px Courier New';
  ctx.fillStyle='#444'; ctx.shadowBlur=0;
  ctx.fillText('SCORE', canvas.width/2, 64);
  ctx.restore();
}

// ── Game state ────────────────────────────────────────────────────────────────
let state='menu';
let best=parseInt(localStorage.getItem('echoRiderBest')||'0');
let lastT=0, deathAlpha=0, showDead=false;

function startGame(){
  resetBird(); resetPipes();
  sparks=[]; deathParts=[]; sp=0;
  deathAlpha=0; showDead=false;
  state='playing';
  sMenu.style.display='none'; sDead.style.display='none';
  document.getElementById('ui').style.pointerEvents='none';
}

function doDie(){
  if(state!=='playing') return;
  state='dead';
  sfxDie(); shake(18);
  deathBurst(bird.x, bird.y);
  deathAlpha=1;
  if(score>best){ best=score; localStorage.setItem('echoRiderBest',best); }
  dScore.textContent=score;
  dBest.textContent='BEST: '+best;
  setTimeout(()=>{
    showDead=true;
    document.getElementById('ui').style.pointerEvents='';
    sDead.style.display='flex';
  }, 900);
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop(ts){
  const dt=Math.min((ts-lastT)/16.67,3); lastT=ts;
  updShake();

  ctx.fillStyle='#04060f';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.save(); ctx.translate(sx,sy);
  drawStars(dt);

  const vol = getVol();

  if(state==='playing' || state==='dead'){
    drawPipes();
    drawWaveZone(dt, vol);
    drawSparks(dt);
    drawDeathParts(dt);

    if(state==='playing'){
      const alive = updateBird(dt, vol);
      drawBird();
      if(!alive || pipeHit()) doDie();
      updatePipes(dt);
      drawHUD();
      drawVolBar(vol);
    } else {
      // Dead - keep drawing bird ghost fading
      if(deathAlpha>0){
        ctx.save(); ctx.globalAlpha=deathAlpha;
        drawBird();
        ctx.restore();
        deathAlpha-=0.025*dt;
      }
      // Red flash
      if(deathAlpha>0.5){
        ctx.save();
        ctx.fillStyle='rgba(255,30,30,'+(deathAlpha-0.5)*0.5+')';
        ctx.fillRect(-sx,-sy,canvas.width,canvas.height);
        ctx.restore();
      }
    }
  } else if(state==='menu'){
    // Animated preview on menu: a sample bird floating
    const t=ts/1000;
    const preY=canvas.height*0.45+Math.sin(t*1.8)*25;
    ctx.save(); ctx.shadowColor='#0ff'; ctx.shadowBlur=18; ctx.fillStyle='#0ff';
    ctx.beginPath(); ctx.arc(canvas.width/2, preY, 14, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=4; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(canvas.width/2, preY, 6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    drawWaveZone(dt, vol);
    drawVolBar(vol);
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

// ── Buttons ───────────────────────────────────────────────────────────────────
document.getElementById('micBtn').addEventListener('click', async ()=>{
  mstat.textContent='REQUESTING MIC ACCESS...';
  mstat.style.color='#ff0';
  document.getElementById('micBtn').disabled=true;
  const ok=await initAudio(true);
  if(ok && useMic){
    mstat.textContent='✓ MIC ACTIVE — STARTING...';
    mstat.style.color='#0f8';
    setTimeout(startGame, 700);
  } else {
    mstat.textContent='✗ MIC DENIED — switching to tap mode';
    mstat.style.color='#f44';
    document.getElementById('micBtn').disabled=false;
    await initAudio(false);
    setTimeout(startGame, 900);
  }
});

document.getElementById('tapBtn').addEventListener('click', async ()=>{
  await initAudio(false);
  startGame();
});

document.getElementById('retryBtn').addEventListener('click', startGame);

requestAnimationFrame(loop);
</script>
</body>
</html>
